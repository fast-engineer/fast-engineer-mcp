[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fast-engineer-mcp"
dynamic = ["version"]
description = "Local MCP server that connects AI assistants to fast.engineer's verified electrical engineering calculations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "fast.engineer" }]
keywords = ["mcp", "model-context-protocol", "electrical-engineering", "cable-sizing", "fault-current", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.3,<3",
    "anyio>=4.5",
]

[project.urls]
Homepage = "https://fast.engineer/mcp/"
Documentation = "https://fast.engineer/mcp/help/"
Source = "https://github.com/fast-engineer/fast-engineer-mcp"
Changelog = "https://github.com/fast-engineer/fast-engineer-mcp/blob/main/CHANGELOG.md"

[project.scripts]
fast-engineer-mcp = "fast_engineer_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "uvicorn>=0.30",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/fast_engineer_mcp/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/fast_engineer_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p anyio"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
