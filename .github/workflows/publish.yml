# Publishes a release to PyPI with trusted publishing (no API token stored in GitHub).
#
# One-time setup on PyPI: project "fast-engineer-mcp" → Publishing → add a GitHub publisher with
# owner/repository = this repo, workflow = publish.yml, environment = pypi.
# Then: bump __version__, update CHANGELOG.md, `git tag v0.1.0 && git push --tags`, and create a
# GitHub release from the tag. The release event runs this workflow.

name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
          pytest -q
      - name: Check the tag matches the package version
        run: |
          pkg=$(python -c "import fast_engineer_mcp; print(fast_engineer_mcp.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          test "$pkg" = "$tag" || { echo "tag $tag != __version__ $pkg"; exit 1; }
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
